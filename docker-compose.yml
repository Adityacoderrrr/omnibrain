version: "3.8"

services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnibrain-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: omnibrain-postgres
    environment:
      POSTGRES_USER: omnibrain_user
      POSTGRES_PASSWORD: omnibrain_password
      POSTGRES_DB: omnibrain_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 3. FastAPI Backend Application
  backend:
    build: .
    container_name: omnibrain-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://omnibrain_user:omnibrain_password@postgres:5432/omnibrain_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  # 4. Streamlit Frontend Dashboard
  frontend:
    build: .
    container_name: omnibrain-frontend
    command: streamlit run frontend.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
